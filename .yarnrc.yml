nodeLinker: pnp

# The default global cache lives under %LOCALAPPDATA% on C:. Keep it inside
# the project (on D:) instead, since C: on this machine is near capacity —
# see README "Disk space" note.
enableGlobalCache: false

# eslint-config-next requires `next` at runtime (for its babel-eslint-parser
# integration) without declaring it as a dependency. Under Yarn PnP's strict
# resolution this makes the require ambiguous/unsound and fails `next build`'s
# lint step. This is Yarn's documented fix for that exact mismatch — declare
# the missing dependency ourselves instead of loosening PnP overall.
packageExtensions:
  "eslint-config-next@*":
    dependencies:
      # Match the range apps/web already depends on so this resolves to the
      # same Next.js instance instead of independently pulling a newer major.
      next: "^14.2.5"
